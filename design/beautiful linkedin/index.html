<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Beautiful LinkedIn — Redesign</title>
<style>
  body { margin: 0; background: #faf9f6; font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: white; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" data-presets="react">
function App() {
  const { DesignCanvas, DCSection, DCArtboard } = window;
  return (
    <DesignCanvas
      title="Beautiful LinkedIn — Redesign"
      subtitle="Duas direções para o app Electron · busca, resultados e preferências"
    >
      <DCSection
        id="dirs"
        title="Direções de design"
        description="Mesmo produto, duas vozes. Ambas funcionais e navegáveis — clique em ⚙ no header para ver as preferências (incluindo dark mode e API keys)."
      >
        <DCArtboard id="literary" label="A · Literary — editorial, serif, papel" width={1440} height={900}>
          <iframe src="literary.html" title="Literary"></iframe>
        </DCArtboard>
        <DCArtboard id="modern" label="B · Modern — clean, mac-like, vibrante" width={1440} height={900}>
          <iframe src="modern.html" title="Modern"></iframe>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
