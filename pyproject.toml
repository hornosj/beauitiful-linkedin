[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beautiful-linkedin"
version = "0.1.5"
description = "A beautiful CLI for public B2B lead discovery from search results and company pages."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Beautiful LinkedIn" }
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "questionary>=2.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "rapidfuzz>=3.9",
  "duckduckgo-search>=6.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "dnspython>=2.6",
  "browser-cookie3>=0.19",
  "rookiepy>=0.5",
  "phonenumbers>=8.13",
  "telethon>=1.34",
  "playwright>=1.44"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.0"
]
risky = [
  "playwright>=1.44"
]
crawl4ai = [
  "crawl4ai>=0.8"
]
scrapling = [
  "scrapling>=0.2"
]
server = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "pyjwt[crypto]>=2.8"
]

[project.scripts]
beautiful-linkedin = "beautiful_linkedin.main:app"
beautiful-linkedin-server = "beautiful_linkedin.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beautiful_linkedin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
